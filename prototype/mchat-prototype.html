<meta charset="utf-8">
<title>MChat Protótipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8;
    --ground:#F1F5F9; --card:#FFFFFF; --line:#E2E8F0;
    --side:#0F1729; --side-ink:#CBD5E1;
    --accent:#1D4ED8; --ok:#16A34A; --warn:#D97706; --bad:#DC2626; --info:#7C3AED;
    /* mundo mobile (dark fintech) */
    --m-bg:#0A0A0E; --m-card:#16161C; --m-card2:#1E1E26; --m-line:#26262F;
    --m-ink:#F4F4F6; --m-ink2:#9B9BA8; --m-ink3:#6E6E7A;
    --m-ok:#4ADE80; --m-warn:#FBBF24; --m-bad:#F87171; --m-info:#A78BFA; --m-blue:#60A5FA;
    --grad:linear-gradient(135deg,#FF8A3D 0%,#E23A2E 100%);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Instrument Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans)}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h1,h2,h3{line-height:1.2;text-wrap:balance}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  svg.lucide{vertical-align:-3px;flex:none}

  /* ---------- movimento ---------- */
  .btn,.nav-item,.tab,.m-tab,.m-list-item,.launch-card,.call-btn,.qa,.stat,tr{
    transition:transform .12s ease,background .18s ease,box-shadow .18s ease,color .18s ease,border-color .18s ease,opacity .18s}
  .btn:active,.tab:active,.m-tab:active,.qa:active,.call-btn:active,.launch-card:active{transform:scale(.96)}
  .nav-item:active,.m-list-item:active{transform:scale(.985)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  .content>*,.m-sec>*,.login-box,.launch>*{animation:fadeUp .3s ease both}
  .content>*:nth-child(2),.m-sec>*:nth-child(2){animation-delay:.05s}
  .content>*:nth-child(3),.m-sec>*:nth-child(3){animation-delay:.1s}
  .bubble{animation:fadeUp .18s ease both}
  .overlay{animation:fade .16s ease}
  .modal{animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
  .toast{animation:slideUp .28s ease}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ---------- botões ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:8px 14px;
    font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card)}
  .btn:hover{background:var(--ground);box-shadow:0 2px 8px rgba(15,23,42,.07)}
  .btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-dark:hover{background:#1E293B}
  .btn-blue{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-blue:hover{background:#1E40AF}
  .btn-red{color:var(--bad);border-color:#FCA5A5}
  .btn-red:hover{background:#FEF2F2}
  .btn-green{color:var(--ok);border-color:#86EFAC}
  .btn-green:hover{background:#F0FDF4}
  .btn-sm{padding:5px 10px;font-size:13px}

  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
  .b-ok{background:#DCFCE7;color:#15803D}
  .b-warn{background:#FEF3C7;color:#B45309}
  .b-bad{background:#FEE2E2;color:#B91C1C}
  .b-info{background:#EDE9FE;color:#6D28D9}
  .b-gray{background:#F1F5F9;color:#475569}
  .b-super{background:var(--ink);color:#fff}
  .b-blue{background:#DBEAFE;color:#1D4ED8}

  /* ---------- launcher ---------- */
  .launch{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
  .launch h1{font-size:34px;font-weight:700}
  .launch h1 .tag{font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:3px 8px;
    vertical-align:middle;margin-left:10px;letter-spacing:.04em}
  .launch p{color:var(--ink-2);max-width:52ch;text-align:center}
  .launch-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .launch-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;
    width:290px;text-align:left}
  .launch-card:hover{box-shadow:0 12px 34px rgba(15,23,42,.14);transform:translateY(-3px)}
  .launch-card .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
  .ico-dark{background:var(--side)}
  .ico-grad{background:var(--grad)}
  .launch-card h2{font-size:19px;margin:14px 0 6px}
  .launch-card p{color:var(--ink-2);font-size:14px;text-align:left}
  .hint{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:12px;
    padding:12px 16px;font-size:13.5px;max-width:660px}
  .hint b{font-weight:700}

  /* ---------- admin shell ---------- */
  .admin{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
  .side .logo{color:#fff;font-size:20px;font-weight:700;padding:6px 10px 20px;display:flex;align-items:center;gap:8px}
  .side .logo .tag{font-size:11px;background:#1E293B;border-radius:5px;padding:2px 7px;font-weight:600;letter-spacing:.05em}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;
    border-radius:9px;font-size:14.5px;font-weight:500;color:var(--side-ink)}
  .nav-item:hover{background:#1E293B;color:#fff}
  .nav-item.on{background:#1E293B;color:#fff;box-shadow:inset 3px 0 0 #FF8A3D}
  .side .me{margin-top:auto;border-top:1px solid #1E293B;padding:14px 10px 4px;font-size:13px}
  .side .me .nm{color:#fff;font-weight:600}
  .side .me .em{color:#64748B;font-size:12px;word-break:break-all}
  .main{padding:0}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:18px 28px;font-size:20px;font-weight:700}
  .content{padding:24px 28px;display:flex;flex-direction:column;gap:18px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat:hover{box-shadow:0 6px 18px rgba(15,23,42,.08);transform:translateY(-2px)}
  .stat .t{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);font-size:14px;font-weight:500}
  .stat .t svg{color:var(--ink-3)}
  .stat .v{font-size:32px;font-weight:700;margin:6px 0 2px}
  .stat .s{color:var(--ink-3);font-size:12.5px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel .head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:#F8FAFC}
  tr:last-child td{border-bottom:none}
  .empty{color:var(--ink-3);text-align:center;padding:34px 10px}
  .tabs{display:inline-flex;background:#E8EDF3;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .tab{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  .row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .search-row{display:flex;gap:10px;max-width:520px}
  .cell-sub{color:var(--ink-3);font-size:12.5px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,10,14,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal{background:var(--card);border-radius:16px;width:min(440px,100%);max-height:88vh;overflow:auto;padding:22px}
  .modal h3{font-size:17px;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .checks{display:flex;flex-direction:column;gap:7px}
  .checks label{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--ink)}
  .checks input{width:auto}
  .modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}
  .okbox{background:#F0FDF4;border:1px solid #BBF7D0;color:#15803D;border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}

  /* ---------- login admin ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;width:min(380px,100%)}
  .login-box h2{margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .login-box .sub{color:var(--ink-2);font-size:14px;margin-bottom:18px}

  /* ================= MOBILE (dark fintech) ================= */
  .mob-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px;gap:26px;flex-wrap:wrap}
  .phone{width:390px;height:800px;background:var(--m-bg);color:var(--m-ink);border-radius:46px;border:10px solid #000;
    box-shadow:0 30px 80px rgba(10,10,14,.5);display:flex;flex-direction:column;overflow:hidden;position:relative}
  .phone .notch{height:28px;background:var(--m-bg);display:flex;justify-content:center;align-items:center;flex:none}
  .phone .notch i{width:110px;height:20px;background:#000;border-radius:0 0 14px 14px}
  .phone input,.phone select{background:var(--m-card2);border-color:var(--m-line);color:var(--m-ink);border-radius:12px}
  .phone input::placeholder{color:var(--m-ink3)}
  .phone input:focus,.phone select:focus{border-color:#FF8A3D;box-shadow:0 0 0 3px rgba(255,138,61,.18)}
  .phone button:focus-visible{outline-color:#FF8A3D}

  .m-head{padding:12px 18px 12px;border-bottom:1px solid var(--m-line);flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--m-bg)}
  .m-head h2{font-size:21px;font-weight:700}
  .icbtn{width:38px;height:38px;border-radius:50%;background:var(--m-card);border:1px solid var(--m-line);
    display:inline-flex;align-items:center;justify-content:center;color:var(--m-ink)}
  .icbtn:hover{background:var(--m-card2)}
  .m-body{flex:1;overflow-y:auto;background:var(--m-bg)}
  .m-tabs{flex:none;display:flex;border-top:1px solid var(--m-line);background:var(--m-bg);padding:8px 4px 16px}
  .m-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--m-ink3);padding:6px 2px;border-radius:10px}
  .m-tab.on{color:var(--m-ink)}
  .m-sec{padding:16px}
  .m-card{background:var(--m-card);border:1px solid var(--m-line);border-radius:18px;padding:16px;margin-bottom:12px}

  /* botões no mundo mobile */
  .phone .btn{background:var(--m-card2);border-color:var(--m-line);color:var(--m-ink)}
  .phone .btn:hover{background:#26262F;box-shadow:none}
  .phone .btn-blue{background:#fff;color:#0A0A0E;border-color:#fff;font-weight:700}
  .phone .btn-blue:hover{background:#E8E8EC}
  .phone .btn-dark{background:var(--m-card2);color:var(--m-ink);border-color:var(--m-line)}
  .phone .btn-dark:hover{background:#26262F}
  .phone .btn-red{color:var(--m-bad);border-color:rgba(248,113,113,.35)}
  .phone .btn-red:hover{background:rgba(248,113,113,.1)}
  /* badges no mundo mobile */
  .phone .b-ok{background:rgba(74,222,128,.14);color:var(--m-ok)}
  .phone .b-warn{background:rgba(251,191,36,.14);color:var(--m-warn)}
  .phone .b-bad{background:rgba(248,113,113,.14);color:var(--m-bad)}
  .phone .b-info{background:rgba(167,139,250,.16);color:var(--m-info)}
  .phone .b-blue{background:rgba(96,165,250,.16);color:var(--m-blue)}
  .phone .b-gray{background:#26262F;color:var(--m-ink2)}
  .phone .b-super{background:#fff;color:#0A0A0E}
  .phone .err{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--m-bad)}
  .phone .okbox{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--m-ok)}
  .phone .cell-sub{color:var(--m-ink3)}
  .phone .field label{color:var(--m-ink2)}
  .phone .empty{color:var(--m-ink3)}
  .phone .modal{background:var(--m-card);color:var(--m-ink)}
  .phone .checks label{color:var(--m-ink)}
  .phone h3{color:var(--m-ink)}

  /* carteira (ref fintech dark) */
  .hero{background:var(--grad);border-radius:22px;padding:20px;color:#fff;margin-bottom:14px;
    box-shadow:0 14px 34px rgba(226,58,46,.25);position:relative;overflow:hidden}
  .hero::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero .lbl{font-size:13px;opacity:.85;font-weight:500}
  .hero .amt{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 12px}
  .hero .amt small{font-size:18px;font-weight:600;opacity:.85}
  .hero .row{display:flex;gap:8px;position:relative;z-index:1}
  .hero .chip{background:rgba(0,0,0,.22);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
  .qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .qa{background:var(--m-card);border:1px solid var(--m-line);border-radius:16px;padding:13px 6px 11px;
    display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--m-ink)}
  .qa:hover{background:var(--m-card2)}
  .qa svg{color:var(--m-ink)}
  .qa[disabled]{opacity:.4;cursor:not-allowed}
  .bal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--m-line)}
  .bal-row:last-child{border-bottom:none}
  .bal-row .cur{font-weight:600;display:flex;align-items:center;gap:10px}
  .bal-row .cur .sym{width:36px;height:36px;border-radius:12px;background:var(--m-card2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--m-ink2)}
  .bal-row .cur small{display:block;color:var(--m-ink3);font-weight:500;font-size:12px}
  .sec-title{font-size:15px;font-weight:700;margin:4px 2px 10px;color:var(--m-ink)}

  /* chat (ref clean messenger, traduzida pro dark) */
  .chat-search{padding:12px 16px 4px}
  .m-list-item{display:flex;align-items:center;gap:12px;background:transparent;border-bottom:1px solid var(--m-line);padding:13px 18px;width:100%;text-align:left;color:var(--m-ink)}
  .m-list-item:hover{background:var(--m-card)}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--m-card2);color:var(--m-ink);
    display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;border:1px solid var(--m-line)}
  .avatar.grad{background:var(--grad);color:#fff;border:none}
  .m-list-item .info{flex:1;min-width:0}
  .m-list-item .nm{font-weight:600}
  .m-list-item .pv{color:var(--m-ink3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-body{display:flex;flex-direction:column;gap:6px;padding:14px}
  .bubble{max-width:76%;padding:10px 14px;border-radius:18px;font-size:14.5px;word-break:break-word;line-height:1.4}
  .bubble.me{align-self:flex-end;background:#fff;color:#0A0A0E;border-bottom-right-radius:6px}
  .bubble.them{align-self:flex-start;background:var(--m-card2);color:var(--m-ink);border-bottom-left-radius:6px}
  .bubble time{display:block;font-size:10.5px;opacity:.55;margin-top:3px}
  .chat-input{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--m-line);background:var(--m-bg);flex:none;align-items:center}
  .chat-input input{border-radius:999px;padding:11px 16px}
  .send-btn{width:44px;height:44px;border-radius:50%;background:#fff;color:#0A0A0E;flex:none;
    display:flex;align-items:center;justify-content:center}
  .send-btn:hover{background:#E8E8EC}
  .send-btn:active{transform:scale(.9)}
  .e2ee{color:var(--m-ink3);font-size:11.5px;text-align:center;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:6px}

  /* ligação */
  .call{position:absolute;inset:0;background:linear-gradient(180deg,#0A0A0E 0%,#1A1A22 100%);color:#fff;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
  .call .avatar{width:92px;height:92px;font-size:32px}
  .call h3{font-size:24px}
  .call .st{color:var(--m-ink2);font-size:14px;display:flex;align-items:center;gap:7px}
  .call .acts{display:flex;gap:28px;margin-top:28px}
  .call-btn{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .cb-red{background:#E23A2E}.cb-green{background:#22C55E}

  .back-link{position:fixed;top:14px;left:14px;z-index:60;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(15,23,42,.12);
    display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .15s}
  .back-link:hover{box-shadow:0 4px 14px rgba(15,23,42,.18)}
  .back-link:active{transform:scale(.95)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    border-radius:12px;padding:11px 18px;font-size:14px;z-index:99;box-shadow:0 10px 30px rgba(15,23,42,.35)}
  @media (max-width:900px){.admin{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .me{display:none}}
</style>

<div id="app"></div>
<audio id="remoteAudio" autoplay></audio>

<script>
'use strict';
/* =====================================================================
   MChat Protótipo — painel web + app mobile sobre a mesma base local.
   Estado em localStorage (compartilhado entre abas); sincronização ao
   vivo via BroadcastChannel; ligação de voz real via WebRTC entre abas.
   ===================================================================== */

/* ---------------- RBAC (espelha MChat/Core/Models/Role.swift) -------- */
const PERMS = ['viewDashboard','viewClients','manageClients','viewBalances','manageAssets',
  'viewWithdrawals','approveWithdrawals','viewPayments','processPayments',
  'viewUsers','editRoles','promoteClient','createInvites','viewOwnInvites',
  'viewAllInvites','revokeInvites','manageInviteLimits','useChat','useVoiceCalls'];

const ROLES = {
  super_admin:{label:'Super Admin', perms:PERMS},
  adm:{label:'ADM', perms:['viewDashboard','viewClients','manageClients','viewUsers','promoteClient',
    'viewWithdrawals','viewPayments','createInvites','viewOwnInvites','viewAllInvites','useChat','useVoiceCalls']},
  finance_manager:{label:'Gestor Financeiro', perms:['viewDashboard','viewBalances','manageAssets',
    'viewWithdrawals','viewPayments','createInvites','viewOwnInvites','useChat','useVoiceCalls']},
  withdrawal_operator:{label:'Operador de Saques', perms:['viewDashboard','viewWithdrawals','approveWithdrawals','viewOwnInvites','useChat']},
  payment_operator:{label:'Operador de Pagamentos', perms:['viewDashboard','viewPayments','processPayments','viewOwnInvites','useChat']},

function grantableRoles(u){
  if((u.roles||[]).includes('super_admin')) return Object.keys(ROLES);

  return ['somente_chat'];

/* ---------------- ligação de voz (WebRTC entre abas) ---------------- */
const rtc = new BroadcastChannel('mchat_rtc');
let CALL = {state:'idle', peer:null, pc:null, stream:null, t0:null, timer:null, pendingOffer:null};

async function makePC(){
  const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.onicecandidate = ev => { if(ev.candidate) rtc.postMessage({type:'ice',from:S.uid,to:CALL.peer,cand:ev.candidate.toJSON()}); };
  pc.ontrack = ev => { document.getElementById('remoteAudio').srcObject = ev.streams[0]; };
  CALL.stream = await navigator.mediaDevices.getUserMedia({audio:true});
  CALL.stream.getTracks().forEach(t=>pc.addTrack(t,CALL.stream));
  return pc;
}
async function startCall(toId){
  if(CALL.state!=='idle') return;
  try{
    CALL.peer = toId; CALL.state='outgoing';
    render();
    CALL.pc = await makePC();
    const offer = await CALL.pc.createOffer();
    await CALL.pc.setLocalDescription(offer);
    rtc.postMessage({type:'offer',from:S.uid,fromName:me()?.name,to:toId,sdp:offer});
  }catch(e){
    toast('Microfone indisponível: '+e.message); endCall();
  }
  render();
}
async function acceptCall(){
  try{
    CALL.pc = await makePC();
    await CALL.pc.setRemoteDescription(CALL.pendingOffer);
    const answer = await CALL.pc.createAnswer();
    await CALL.pc.setLocalDescription(answer);
    rtc.postMessage({type:'answer',from:S.uid,to:CALL.peer,sdp:answer});
    CALL.state='active'; CALL.t0=Date.now(); tick();
  }catch(e){ toast('Falha ao atender: '+e.message); endCall(); }
  render();
}
function declineCall(){ rtc.postMessage({type:'hangup',from:S.uid,to:CALL.peer}); cleanupCall(); }
function endCall(){
  if(CALL.state==='idle') return;
  rtc.postMessage({type:'hangup',from:S.uid,to:CALL.peer});
  cleanupCall();
}
function cleanupCall(){
  CALL.pc?.close(); CALL.stream?.getTracks().forEach(t=>t.stop());
  clearInterval(CALL.timer);
  CALL = {state:'idle',peer:null,pc:null,stream:null,t0:null,timer:null,pendingOffer:null};
  render();
}
function tick(){
  clearInterval(CALL.timer);
  CALL.timer = setInterval(()=>{
    const el = document.getElementById('call-timer');
    if(el && CALL.t0){
      const s = Math.floor((Date.now()-CALL.t0)/1000);
      el.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }
  },1000);
}
rtc.onmessage = async e => {
  const m = e.data;
  if(m.to!==S.uid) return;
  if(m.type==='offer'){
    if(CALL.state!=='idle'){ rtc.postMessage({type:'hangup',from:S.uid,to:m.from}); return; }
    CALL.peer=m.from; CALL.state='incoming'; CALL.pendingOffer=m.sdp; render();
  }else if(m.type==='answer' && CALL.pc){
    await CALL.pc.setRemoteDescription(m.sdp);
    CALL.state='active'; CALL.t0=Date.now(); tick(); render();
  }else if(m.type==='ice' && CALL.pc){
    try{ await CALL.pc.addIceCandidate(m.cand); }catch(err){}
  }else if(m.type==='hangup'){
    cleanupCall();
  }
};

/* ---------------- ações de domínio ---------------- */
function loginAdmin(email,pass){
  const u = DB.users.find(x=>x.email===email.trim());
  if(!u || u.pass!==pass){ S.authErr='E-mail ou senha inválidos.'; render(); return; }
  const adminPerms=['viewDashboard','viewClients','viewWithdrawals','viewPayments','viewUsers','viewAllInvites'];
  if(u.status!=='active' || !adminPerms.some(p=>userPerms(u).has(p))){
    S.authErr='Este usuário não tem acesso ao painel administrativo.'; render(); return;
  }
  S.authErr=null; setUser(u.id); S.adminPage='dashboard'; render();
}
function loginMobile(phone,pass){
  const u = DB.users.find(x=>normPhone(x.phone)===normPhone(phone));
  if(!u || u.pass!==pass){ S.authErr='Telefone ou senha inválidos.'; render(); return; }
  S.authErr=null; setUser(u.id); S.mobileScreen='main';
  S.mobileTab = can(u,'viewBalances') ? 'wallet' : 'chat';
  render();
}
/* Cadastro: o telefone PRECISA ter convite pré-registrado; senão, negado. */
function checkPhoneInvite(phone){
  expireInvites();
  const n = normPhone(phone);
  if(!n){ S.authErr='Informe um telefone válido.'; render(); return; }
  if(DB.users.some(u=>normPhone(u.phone)===n)){
    S.authErr='Este número já possui conta. Use "Entrar".'; render(); return;
  }
  const inv = DB.invites.find(i=>normPhone(i.phone)===n && i.status==='pending' && i.expiresAt>Date.now());
  if(!inv){ S.regInvite=null; S.mobileScreen='denied'; S.authErr=null; render(); return; }
  S.regInvite={...inv, phoneTyped:phone}; S.regStep=2; S.authErr=null; render();
}
function registerMobile(name,pass){
  const inv = DB.invites.find(i=>i.id===S.regInvite?.id);
  if(!inv || inv.status!=='pending' || inv.expiresAt<Date.now()){
    S.authErr='Este convite não está mais válido.'; S.regStep=1; render(); return;
  }
  if(!name.trim() || pass.length<4){ S.authErr='Preencha o nome e uma senha com 4+ caracteres.'; render(); return; }
  const u = {id:uid(),name:name.trim(),phone:inv.phone,email:null,pass,
    roles:[...inv.grantedRoles],status:'pending',createdAt:Date.now(),
    invitedBy:inv.createdBy,inviteId:inv.id,
    inviteLimit:inv.grantedRoles.includes('chat_plus')?3:null,
    wallet:{BRL:0,USD:0,EUR:0,GBP:0}};
  inv.status='accepted'; inv.acceptedBy=u.id; inv.acceptedAt=Date.now();
  DB.users.push(u); setUser(u.id); S.mobileScreen='main'; S.regStep=1; S.regInvite=null;
  save(); toast('Conta criada — aguardando aprovação de um administrador.');
}
function createInvite(phone,roles){
  const u = me();
  if(!can(u,'createInvites')){ S.modalErr='Sem permissão para convidar.'; render(); return; }
  if(u.inviteLimit!=null && inviteUsage(u)>=u.inviteLimit){
    S.modalErr=`Limite de convites atingido (${inviteUsage(u)}/${u.inviteLimit}). Peça ao Super Admin para aumentar seu limite.`;
    render(); return;
  }
  const n = normPhone(phone);
  if(n.length<8){ S.modalErr='Informe o telefone do convidado (com DDD).'; render(); return; }
  if(DB.users.some(x=>normPhone(x.phone)===n)){ S.modalErr='Este número já possui conta.'; render(); return; }
  if(DB.invites.some(i=>normPhone(i.phone)===n && i.status==='pending' && i.expiresAt>Date.now())){
    S.modalErr='Já existe convite pendente para este número.'; render(); return;
  }
  const allowed = grantableRoles(u);
  if(!roles.length || roles.some(r=>!allowed.includes(r))){
    S.modalErr='Selecione ao menos uma role que você pode conceder.'; render(); return;
  }
  const inv = {id:uid(),code:inviteCode(),phone:n,createdBy:u.id,grantedRoles:roles,
    status:'pending',createdAt:Date.now(),expiresAt:Date.now()+7*86400000,
    acceptedBy:null,acceptedAt:null,revokedBy:null,revokedAt:null};
  DB.invites.push(inv);
  S.modalErr=null; S.modalOk=`Convite criado para ${n} — código ${inv.code}.`;
  save();
}
function revokeInvite(id){
  const u = me(), inv = DB.invites.find(i=>i.id===id);
  if(!inv || inv.status!=='pending') return;
  if(inv.createdBy!==u.id && !can(u,'revokeInvites')){ toast('Sem permissão para revogar este convite.'); return; }
  inv.status='revoked'; inv.revokedBy=u.id; inv.revokedAt=Date.now();
  save(); toast('Convite revogado.');
}
function setUserStatus(id,status){
  if(!can(me(),'manageClients')){ toast('Sem permissão.'); return; }
  const u = userById(id); if(!u) return;
  u.status=status; save();
  toast(status==='active'?'Conta ativada.':status==='suspended'?'Conta suspensa.':'Status atualizado.');
}
function saveRoles(id,roles){
  const acting = me(), target = userById(id);
  if(!can(acting,'editRoles')){ S.modalErr='Sem permissão para editar roles.'; render(); return; }
  const wasSuper = target.roles.includes('super_admin'), willSuper = roles.includes('super_admin');
  if(wasSuper!==willSuper && !acting.roles.includes('super_admin')){
    S.modalErr='Só um Super Admin concede ou remove a role Super Admin.'; render(); return;
  }
  if(!roles.length){ S.modalErr='Selecione ao menos uma role.'; render(); return; }
  if(roles.includes('chat_plus') && target.inviteLimit==null) target.inviteLimit=3;
  target.roles=roles; S.modal=null; S.modalErr=null; save(); toast('Roles atualizadas.');
}
function saveInviteLimit(id,raw){
  if(!can(me(),'manageInviteLimits')){ S.modalErr='Só o Super Admin gerencia limites de convite.'; render(); return; }
  const target = userById(id); if(!target) return;
  const trimmed = String(raw).trim();
  if(trimmed===''){ target.inviteLimit=null; }
  else{
    const n = parseInt(trimmed,10);
    if(!Number.isInteger(n)||n<0){ S.modalErr='Informe um número inteiro (ou vazio para ilimitado).'; render(); return; }
    target.inviteLimit=n;
  }
  S.modal=null; S.modalErr=null; save(); toast('Limite de convites atualizado.');
}
function requestWithdrawal(amountStr,currency){
  const u = me(), cents = parseMoney(amountStr);
  if(!cents){ S.modalErr='Informe um valor válido.'; render(); return; }
  if((u.wallet[currency]||0) < cents){ S.modalErr='Saldo insuficiente em '+currency+'.'; render(); return; }
  DB.withdrawals.push({id:uid(),clientId:u.id,amount:cents,currency,status:'pending',
    requestedAt:Date.now(),decidedBy:null,decidedAt:null});
  S.modal=null; S.modalErr=null; save(); toast('Saque solicitado — aguardando aprovação.');
}
function decideWithdrawal(id,approve){
  const acting = me(), w = DB.withdrawals.find(x=>x.id===id);
  if(!can(acting,'approveWithdrawals')){ toast('Sem permissão.'); return; }
  if(!w || w.status!=='pending') return;
  if(approve){
    const c = userById(w.clientId);
    if((c.wallet[w.currency]||0) < w.amount){ toast('Saldo do cliente insuficiente.'); return; }
    c.wallet[w.currency]-=w.amount; w.status='approved';
  }else w.status='cancelled';
  w.decidedBy=acting.id; w.decidedAt=Date.now(); save();
}
function completeWithdrawal(id){
  const w = DB.withdrawals.find(x=>x.id===id);
  if(!can(me(),'approveWithdrawals') || !w || w.status!=='approved') return;
  w.status='completed'; save();
}
function requestPayment(type,beneficiary,amountStr,currency){
  const u = me(), cents = parseMoney(amountStr);
  if(!cents){ S.modalErr='Informe um valor válido.'; render(); return; }
  if(!beneficiary.trim()){ S.modalErr='Informe o beneficiário.'; render(); return; }
  if((u.wallet[currency]||0) < cents){ S.modalErr='Saldo insuficiente em '+currency+'.'; render(); return; }
  DB.payments.push({id:uid(),clientId:u.id,type,beneficiary:beneficiary.trim(),amount:cents,currency,
    status:'pending',requestedAt:Date.now(),processedBy:null,processedAt:null});
  S.modal=null; S.modalErr=null; save(); toast('Pagamento enviado para processamento.');
}
function processPayment(id,complete){
  const acting = me(), p = DB.payments.find(x=>x.id===id);
  if(!can(acting,'processPayments')){ toast('Sem permissão.'); return; }
  if(!p || p.status!=='pending') return;
  if(complete){
    const c = userById(p.clientId);
    if((c.wallet[p.currency]||0) < p.amount){ toast('Saldo do cliente insuficiente.'); return; }
    c.wallet[p.currency]-=p.amount; p.status='completed';
  }else p.status='cancelled';
  p.processedBy=acting.id; p.processedAt=Date.now(); save();
}
function sendMsg(toId,text){
  if(!text.trim()) return;
  DB.messages.push({id:uid(),from:S.uid,to:toId,text:text.trim(),at:Date.now()});
  save();
}

/* Ícones Lucide com fallback: tenta o cdnjs se o jsdelivr falhar; sem
   rede, a UI degrada para texto (todos os controles têm rótulo). */
let iconRetry = false;
function drawIcons(){
  if(window.lucide){ lucide.createIcons(); return; }
  if(iconRetry) return;
  iconRetry = true;
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/lucide/0.294.0/umd/lucide.min.js';
  s.onload = () => { if(window.lucide) lucide.createIcons(); };
  document.head.appendChild(s);
}
let focusMemo=null;
function preserveFocus(fn){
  const el = document.activeElement;
  if(el && (el.tagName==='INPUT'||el.tagName==='SELECT') && el.id)
    focusMemo={id:el.id,val:el.value,pos:el.selectionStart};
  fn();
  if(focusMemo){
    const el2 = document.getElementById(focusMemo.id);
    if(el2){ el2.value=focusMemo.val; el2.focus(); try{el2.setSelectionRange(focusMemo.pos,focusMemo.pos);}catch(e){} }
    focusMemo=null;
  }
}

    <button class="tab ${S.clientFilter===k?'on':''}" onclick="S.clientFilter='${k}';render()">${l}</button>`).join('')}

  <div class="panel"><table>
    <thead><tr><th>Nome</th><th>E-mail</th><th>Status / Roles</th><th>Saldo BRL</th><th>Criado em</th><th style="text-align:right">Ações</th></tr></thead>

    body = `

    ${S.modalErr?`<div class="err">${esc(S.modalErr)}</div>`:''}
    <div class="foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-blue" onclick="requestPayment(document.getElementById('py-type').value,document.getElementById('py-ben').value,document.getElementById('py-val').value,document.getElementById('py-cur').value)">Enviar</button>
    </div>`;
  }
  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`;
}

/* ---------------- MOBILE ---------------- */
function viewMobile(){
  const u = me();
  let screen;
  if(CALL.state!=='idle') screen = mobileMain(u);
  else if(!u || S.mobileScreen==='auth' || S.mobileScreen==='denied') screen = mobileAuth();
  else screen = mobileMain(u);
  return `
  <button class="back-link" onclick="goHome()">${ic('arrow-left',14)} Início</button>
  <div class="mob-stage"><div class="phone">
    <div class="notch"><i></i></div>
    ${screen}
    ${callOverlay()}
  </div></div>`;
}

function mobileAuth(){
  if(S.mobileScreen==='denied'){
    return `
    <div class="m-body"><div class="m-sec" style="padding-top:70px;text-align:center">
      <div style="display:flex;justify-content:center;color:var(--m-bad)">${ic('shield-x',54)}</div>
      <h2 style="margin:16px 0 8px">Cadastro negado</h2>
      <p style="color:var(--m-ink2);font-size:14.5px;max-width:30ch;margin:0 auto">
        Este número não possui um convite pré-registrado. O MChat é acessível
        apenas por convite de quem já usa o app.</p>
      <button class="btn btn-blue" style="margin-top:24px" onclick="S.mobileScreen='auth';S.regStep=1;render()">${ic('arrow-left',14)} Voltar</button>
    </div></div>
    <div class="m-tabs"></div>`;
  }
  const reg2 = S.regStep===2 && S.regInvite;
  return `
  <div class="m-body"><div class="m-sec" style="padding-top:40px">
    <div style="text-align:center;margin-bottom:26px">
      <div style="width:64px;height:64px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff">${ic('message-circle',30)}</div>
      <h2 style="font-size:26px">MChat</h2>
      <p style="color:var(--m-ink3);font-size:13.5px">Mensagens e finanças, só por convite.</p>
    </div>
    ${reg2 ? `
    <div class="m-card">
      <div class="okbox" style="margin-top:0">✓ Convite encontrado para
        <b class="num">${esc(S.regInvite.phone)}</b></div>
      <p style="font-size:13px;color:var(--m-ink2);margin-bottom:10px">Você entrará como:
        <span class="chips">${roleChips(S.regInvite.grantedRoles)}</span></p>
      <div class="field"><label for="rg-name">Seu nome</label><input id="rg-name" placeholder="Nome completo"></div>
      <div class="field"><label for="rg-pass">Senha</label><input id="rg-pass" type="password" placeholder="Mínimo 4 caracteres"></div>
      ${S.authErr?`<div class="err">${esc(S.authErr)}</div>`:''}
      <button class="btn btn-blue" style="width:100%;justify-content:center"
        onclick="registerMobile(document.getElementById('rg-name').value,document.getElementById('rg-pass').value)">Criar conta</button>
      <button class="btn btn-sm" style="width:100%;justify-content:center;margin-top:8px"
        onclick="S.regStep=1;S.regInvite=null;render()">Cancelar</button>
    </div>` : `
    <div class="m-card">
      <h3 style="font-size:15px;margin-bottom:10px">Entrar</h3>
      <div class="field"><label for="lg-phone">Telefone</label>
        <input id="lg-phone" inputmode="tel" placeholder="Número com DDD"></div>
      <div class="field"><label for="lg-pass">Senha</label>
        <input id="lg-pass" type="password" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')loginMobile(document.getElementById('lg-phone').value,this.value)"></div>
      ${S.authErr?`<div class="err">${esc(S.authErr)}</div>`:''}
      <button class="btn btn-blue" style="width:100%;justify-content:center"
        onclick="loginMobile(document.getElementById('lg-phone').value,document.getElementById('lg-pass').value)">Entrar</button>
    </div>
    <div class="m-card">
      <h3 style="font-size:15px;margin-bottom:6px">Criar conta</h3>
      <p style="font-size:13px;color:var(--m-ink2);margin-bottom:10px">
        Seu telefone precisa ter um convite pré-registrado por alguém que já usa o app.</p>
      <div class="field"><label for="rg-phone">Telefone convidado</label>
        <input id="rg-phone" inputmode="tel" placeholder="Número com DDD"></div>
      <button class="btn btn-dark" style="width:100%;justify-content:center"
        onclick="checkPhoneInvite(document.getElementById('rg-phone').value)">Verificar convite</button>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--m-ink3)">
      Demo — Adm Super: <span class="num">11900000001</span>/super123 ·
      Chat: <span class="num">11900000003</span>/chat123 ·
      Chat Plus: <span class="num">11900000004</span>/plus123<br>
      Convite pendente: <span class="num">11999990000</span></p>`}
  </div></div>
  <div class="m-tabs"></div>`;
}

function mobileMain(u){
  if(!u){ S.mobileScreen='auth'; return mobileAuth(); }
  if(u.status!=='active'){
    return `
    <div class="m-body"><div class="m-sec" style="padding-top:70px;text-align:center">
      <div style="display:flex;justify-content:center;color:${u.status==='pending'?'var(--m-warn)':'var(--m-bad)'}">
        ${ic(u.status==='pending'?'clock':'shield-x',54)}</div>
      <h2 style="margin:16px 0 8px">${u.status==='pending'?'Aguardando aprovação':'Conta suspensa'}</h2>
      <p style="color:var(--m-ink2);font-size:14.5px;max-width:30ch;margin:0 auto">
        ${u.status==='pending'
          ?'Sua conta foi criada e está em análise por um administrador.'
          :'Sua conta foi suspensa. Fale com um administrador.'}</p>
      <button class="btn" style="margin-top:24px" onclick="logout()">Sair</button>
    </div></div><div class="m-tabs"></div>`;
  }
  const tabs = [
    ['wallet','Carteira','wallet','viewBalances'],
    ['chat','Chat','message-circle','useChat'],
    ['invites','Convites','send','createInvites'],
    ['profile','Perfil','user',null]
  ].filter(([,, ,p])=>!p||can(u,p));
  if(!tabs.some(([k])=>k===S.mobileTab)) S.mobileTab = tabs[0][0];
  const bodies = {wallet:mWallet,chat:mChat,invites:mInvites,profile:mProfile};
  return `${bodies[S.mobileTab](u)}
  <div class="m-tabs">${tabs.map(([k,l,icn])=>`
    <button class="m-tab ${S.mobileTab===k?'on':''}" onclick="S.mobileTab='${k}';S.chatWith=null;render()">
      ${ic(icn,22)}${l}</button>`).join('')}</div>`;
}

function mWallet(u){
  const myWd = DB.withdrawals.filter(w=>w.clientId===u.id).sort((a,b)=>b.requestedAt-a.requestedAt);
  const myPay = DB.payments.filter(p=>p.clientId===u.id).sort((a,b)=>b.requestedAt-a.requestedAt);
  const canInvite = can(u,'createInvites') && !(u.inviteLimit!=null && inviteUsage(u)>=u.inviteLimit);
  return `
  <div class="m-head">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="avatar grad" style="width:36px;height:36px;font-size:14px">${esc(u.name[0])}</div>
      <h2>Carteira</h2>
    </div>
    <button class="icbtn" onclick="S.mobileTab='profile';render()" aria-label="Perfil">${ic('user',17)}</button>
  </div>
  <div class="m-body"><div class="m-sec">
    <div class="hero">
      <div class="lbl">Saldo total · BRL</div>
      <div class="amt num" id="hero-balance"><small>R$</small> ${new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2}).format((u.wallet.BRL||0)/100)}</div>
      <div class="row">
        ${CURRENCIES.filter(c=>c.code!=='BRL').map(c=>`
          <span class="chip num">${c.sym} ${new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2}).format((u.wallet[c.code]||0)/100)}</span>`).join('')}
      </div>
    </div>
    <div class="qa-grid">
      <button class="qa" onclick="openModal('withdraw')">${ic('arrow-down',19)} Sacar</button>
      <button class="qa" onclick="openModal('pay')">${ic('credit-card',19)} Pagar</button>
      ${can(u,'createInvites')?`
        <button class="qa" ${canInvite?'':'disabled'} onclick="${canInvite?"S.mobileTab='invites';openModal('invite')":''}">${ic('user-plus',19)} Convidar</button>`:''}
      <button class="qa" onclick="S.mobileTab='chat';render()">${ic('message-circle',19)} Chat</button>
    </div>
    <div class="m-card">
      <div class="sec-title">Moedas</div>
      ${CURRENCIES.map(c=>`
        <div class="bal-row">
          <div class="cur"><span class="sym">${c.sym}</span>
            <span>${c.code}<small>${c.name}</small></span></div>
          <div class="num" style="font-weight:600">${fmtMoney(u.wallet[c.code],c.code)}</div>
        </div>`).join('')}
    </div>
    ${myWd.length||myPay.length?`
    <div class="m-card">
      <div class="sec-title">Movimentações</div>
      ${myWd.map(w=>`
        <div class="bal-row"><div><b style="font-size:14px">Saque ${w.currency}</b>
          <div class="cell-sub">${fmtDate(w.requestedAt)}</div></div>
        <div style="text-align:right"><div class="num">−${fmtMoney(w.amount,w.currency)}</div>
          <span class="badge ${WD_BADGE[w.status]}">${WD_LABEL[w.status]}</span></div></div>`).join('')}
      ${myPay.map(p=>`
        <div class="bal-row"><div><b style="font-size:14px">${PAY_TYPES[p.type]} → ${esc(p.beneficiary)}</b>
          <div class="cell-sub">${fmtDate(p.requestedAt)}</div></div>
        <div style="text-align:right"><div class="num">−${fmtMoney(p.amount,p.currency)}</div>
          <span class="badge ${WD_BADGE[p.status]}">${WD_LABEL[p.status]}</span></div></div>`).join('')}
    </div>`:''}
  </div></div>
  ${modalHTML()}`;
}

function mChat(u){
  if(S.chatWith){
    const peer = userById(S.chatWith);
    const msgs = DB.messages
      .filter(m=>(m.from===u.id&&m.to===peer.id)||(m.from===peer.id&&m.to===u.id))
      .sort((a,b)=>a.at-b.at);
    setTimeout(()=>{ const b=document.getElementById('chat-scroll'); if(b) b.scrollTop=b.scrollHeight; },0);
    return `
    <div class="m-head">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="icbtn" onclick="S.chatWith=null;render()" aria-label="Voltar">${ic('chevron-left',19)}</button>
        <div class="avatar" style="width:36px;height:36px;font-size:14px">${esc(peer.name[0])}</div>
        <h2 style="font-size:17px">${esc(peer.name)}</h2>
      </div>
      ${can(u,'useVoiceCalls')&&can(peer,'useVoiceCalls')?`
        <button class="icbtn" onclick="startCall('${peer.id}')" aria-label="Ligar">${ic('phone',17)}</button>`:''}
    </div>
    <div class="m-body" id="chat-scroll">
      <div class="e2ee">${ic('lock',12)} Cifrado ponta-a-ponta — protocolo Signal (simulado no protótipo)</div>
      <div class="chat-body">${msgs.map(m=>`
        <div class="bubble ${m.from===u.id?'me':'them'}">${esc(m.text)}
          <time>${fmtTime(m.at)}</time></div>`).join('')}
      </div>
    </div>
    <div class="chat-input">
      <input id="msg-input" placeholder="Mensagem"
        onkeydown="if(event.key==='Enter'){sendMsg('${peer.id}',this.value);this.value=''}">
      <button class="send-btn" onclick="const i=document.getElementById('msg-input');sendMsg('${peer.id}',i.value);i.value=''" aria-label="Enviar">${ic('send',18)}</button>
    </div>`;
  }
  const q = S.chatSearch.toLowerCase();
  const contacts = DB.users.filter(x=>x.id!==u.id && can(x,'useChat'))
    .filter(x=>!q||x.name.toLowerCase().includes(q));
  const lastMsg = id => DB.messages
    .filter(m=>(m.from===u.id&&m.to===id)||(m.from===id&&m.to===u.id))
    .sort((a,b)=>b.at-a.at)[0];
  const sorted = [...contacts].sort((a,b)=>(lastMsg(b.id)?.at||0)-(lastMsg(a.id)?.at||0));
  return `
  <div class="m-head"><h2>Chat</h2>
    <button class="icbtn" aria-label="Nova conversa">${ic('square-pen',17)}</button></div>
  <div class="m-body">
    <div class="chat-search">
      <input id="chat-search" placeholder="Buscar" value="${esc(S.chatSearch)}"
        oninput="S.chatSearch=this.value;render()" style="border-radius:999px;padding-left:16px">
    </div>
    ${sorted.length?sorted.map(c=>{
      const lm = lastMsg(c.id);
      return `<button class="m-list-item" onclick="S.chatWith='${c.id}';render()">
        <div class="avatar">${esc(c.name[0])}</div>
        <div class="info"><div class="nm">${esc(c.name)}</div>
          <div class="pv">${lm?esc(lm.text):'Toque para conversar'}</div></div>
        ${lm?`<span class="cell-sub num">${fmtTime(lm.at)}</span>`:''}
      </button>`;}).join('')
    :`<div class="empty" style="padding-top:60px">Nenhum contato encontrado.</div>`}
  </div>`;
}

function mInvites(u){
  const mine = DB.invites.filter(i=>i.createdBy===u.id).sort((a,b)=>b.createdAt-a.createdAt);
  const limited = u.inviteLimit!=null;
  const exhausted = limited && inviteUsage(u)>=u.inviteLimit;
  return `
  <div class="m-head"><h2>Convites</h2>
    <button class="btn btn-blue btn-sm" ${exhausted?'disabled style="opacity:.45;cursor:not-allowed"':''}
      onclick="${exhausted?'':"openModal('invite')"}">${ic('plus',14)} Convidar</button></div>
  <div class="m-body"><div class="m-sec">
    ${limited?`
    <div class="m-card" style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13.5px;color:var(--m-ink2)">Convites disponíveis</span>
      <b class="num" style="color:${exhausted?'var(--m-bad)':'var(--m-ok)'}">${inviteUsage(u)} / ${u.inviteLimit}</b>
    </div>
    ${exhausted?`<div class="err" style="margin-top:0">Limite atingido. Peça ao Super Admin para aumentar seu limite de convites.</div>`:''}`:''}
    <p style="font-size:13px;color:var(--m-ink2);margin-bottom:12px">
      Você pré-registra o telefone de quem quer convidar; só esse número conseguirá criar conta.</p>
    ${mine.length?mine.map(i=>`
      <div class="m-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b class="num">${esc(i.phone)}</b>
          <span class="badge ${INV_BADGE[i.status]}">${INV_LABEL[i.status]}</span>
        </div>
        <div class="cell-sub" style="margin:4px 0">Código <span class="num">${i.code}</span> ·
          expira ${fmtDate(i.expiresAt)}</div>
        ${i.acceptedBy?`<div class="cell-sub">Aceito por ${esc(userName(i.acceptedBy))}</div>`:''}
        <div class="chips">${roleChips(i.grantedRoles)}</div>
        ${i.status==='pending'?`
          <button class="btn btn-sm btn-red" style="margin-top:10px" onclick="revokeInvite('${i.id}')">${ic('x',13)} Revogar</button>`:''}
      </div>`).join('')
    :`<div class="empty">Você ainda não convidou ninguém.</div>`}
  </div></div>
  ${modalHTML()}`;
}

function mProfile(u){
  const inviter = u.invitedBy ? userById(u.invitedBy) : null;
  return `
  <div class="m-head"><h2>Perfil</h2></div>
  <div class="m-body"><div class="m-sec">
    <div class="m-card" style="text-align:center">
      <div class="avatar grad" style="width:70px;height:70px;font-size:28px;margin:0 auto 10px">${esc(u.name[0])}</div>
      <h3>${esc(u.name)}</h3>
      <div class="cell-sub num">${esc(u.phone)}</div>
      <div class="chips" style="justify-content:center;margin-top:8px">${roleChips(u.roles)}</div>
    </div>
    <div class="m-card">
      <div class="bal-row"><span style="color:var(--m-ink2)">Status</span>
        <span class="badge ${STATUS_BADGE[u.status]}">${STATUS_LABEL[u.status]}</span></div>
      <div class="bal-row"><span style="color:var(--m-ink2)">Convidado por</span>
        <b>${inviter?esc(inviter.name):'Usuário raiz'}</b></div>
      <div class="bal-row"><span style="color:var(--m-ink2)">Membro desde</span>
        <b class="num">${fmtDate(u.createdAt)}</b></div>
      ${u.inviteLimit!=null?`
      <div class="bal-row"><span style="color:var(--m-ink2)">Convites</span>
        <b class="num">${inviteUsage(u)} / ${u.inviteLimit}</b></div>`:''}
      <div class="bal-row"><span style="color:var(--m-ink2)">Permissões ativas</span>
        <b class="num">${userPerms(u).size}</b></div>
    </div>
    <button class="btn btn-red" style="width:100%;justify-content:center" onclick="logout()">${ic('log-out',15)} Sair da conta</button>
  </div></div>`;
}

/* ---------------- overlay de ligação ---------------- */
function callOverlay(){
  if(CALL.state==='idle') return '';
  const peer = userById(CALL.peer);
  const nm = esc(peer?.name || 'Desconhecido');
  const st = {outgoing:'Chamando…',incoming:'Ligação recebida',active:''}[CALL.state];
  return `
  <div class="call">
    <div class="avatar grad ${CALL.state!=='active'?'pulse':''}">${esc((peer?.name||'?')[0])}</div>
    <h3>${nm}</h3>
    <div class="st">${CALL.state==='active'
      ? `${ic('lock',13)} Ligação cifrada · <span id="call-timer" class="num">00:00</span>` : st}</div>
    <div class="acts">
      ${CALL.state==='incoming'?`
        <button class="call-btn cb-red" onclick="declineCall()" aria-label="Recusar">${ic('phone-off',24)}</button>
        <button class="call-btn cb-green pulse" onclick="acceptCall()" aria-label="Atender">${ic('phone',24)}</button>`
      :`<button class="call-btn cb-red" onclick="endCall()" aria-label="Encerrar">${ic('phone-off',24)}</button>`}
    </div>
  </div>`;
}

/* boot */
expireInvites();
render();
</script>
